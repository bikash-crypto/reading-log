{% extends 'library/base.html' %}

{% block title %}Remove {{ object.title }} | Reading log{% endblock %}

{% block content %}
  <h1>Remove “{{ object.title }}”?</h1>
  <p>This deletes the book and your notes about it. The author stays in your log.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="button--danger">Remove book</button>
    <a class="button button--quiet" href="{{ object.get_absolute_url }}">Keep it</a>
  </form>
{% endblock %}
